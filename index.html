<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Yogananda Wisdom Portal & Devotional Sanctuary</title>
    <script>
      // Universal WebKit / iPadOS Polyfills
      (function() {
        if (typeof Promise !== 'undefined' && !Promise.withResolvers) {
          Promise.withResolvers = function() {
            var resolve, reject;
            var promise = new Promise(function(res, rej) {
              resolve = res;
              reject = rej;
            });
            return { promise: promise, resolve: resolve, reject: reject };
          };
        }
        if (!Array.prototype.at) {
          Array.prototype.at = function(n) {
            n = Math.trunc(n) || 0;
            if (n < 0) n += this.length;
            if (n < 0 || n >= this.length) return undefined;
            return this[n];
          };
        }
        if (!Array.prototype.findLast) {
          Array.prototype.findLast = function(predicate, thisArg) {
            for (var i = this.length - 1; i >= 0; i--) {
              if (predicate.call(thisArg, this[i], i, this)) return this[i];
            }
            return undefined;
          };
        }
        if (!Object.hasOwn) {
          Object.hasOwn = function(obj, prop) {
            return Object.prototype.hasOwnProperty.call(obj, prop);
          };
        }
        if (typeof window !== 'undefined' && !window.requestIdleCallback) {
          window.requestIdleCallback = function(cb) {
            var start = Date.now();
            return window.setTimeout(function() {
              cb({
                didTimeout: false,
                timeRemaining: function() { return Math.max(0, 50 - (Date.now() - start)); }
              });
            }, 1);
          };
          window.cancelIdleCallback = function(id) {
            clearTimeout(id);
          };
        }
      })();
    </script>
    <style>
      #app-fallback-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #020617;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
        text-align: center;
        z-index: 99999;
      }
      .loader-spinner {
        width: 44px;
        height: 44px;
        border: 3px solid rgba(245, 158, 11, 0.2);
        border-top-color: #f59e0b;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 m-0 p-0 overflow-x-hidden">
    <div id="root">
      <div id="app-fallback-loader">
        <div class="loader-spinner"></div>
        <h2 style="font-size: 18px; margin: 0 0 8px 0; color: #ffffff;">Yogananda Wisdom Sanctuary</h2>
        <p id="loader-status" style="font-size: 12px; color: #94a3b8; margin: 0; max-width: 320px; line-height: 1.5;">
          Initializing sanctuary audio, chants & wisdom teachings...
        </p>
        <div id="loader-error-box" style="display: none; margin-top: 16px; padding: 12px; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 12px; max-width: 360px; text-align: left;">
          <p style="color: #fca5a5; font-size: 11px; margin: 0 0 8px 0; font-weight: bold;">Initialization Notice:</p>
          <pre id="loader-error-text" style="color: #fecaca; font-size: 10px; margin: 0; white-space: pre-wrap; font-family: monospace;"></pre>
          <button onclick="localStorage.clear(); sessionStorage.clear(); window.location.reload();" style="margin-top: 10px; width: 100%; padding: 8px; background: #f59e0b; border: none; border-radius: 8px; font-weight: bold; color: #020617; font-size: 11px; cursor: pointer;">
            Clear Cache & Reload
          </button>
        </div>
      </div>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        var box = document.getElementById('loader-error-box');
        var txt = document.getElementById('loader-error-text');
        if (box && txt && document.getElementById('app-fallback-loader')) {
          box.style.display = 'block';
          txt.textContent = (e.message || e.error || 'Script evaluation error') + (e.filename ? ' (' + e.filename + ':' + e.lineno + ')' : '');
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var box = document.getElementById('loader-error-box');
        var txt = document.getElementById('loader-error-text');
        if (box && txt && document.getElementById('app-fallback-loader')) {
          box.style.display = 'block';
          txt.textContent = 'Promise rejected: ' + (e.reason ? (e.reason.message || e.reason) : 'Unknown reason');
        }
      });
    </script>
    <script type="module">
      import('/src/main.tsx')
        .then(function() {
          var status = document.getElementById('loader-status');
          if (status) status.textContent = 'Rendering sanctuary portal...';
        })
        .catch(function(err) {
          console.error("Module launch error:", err);
          var box = document.getElementById('loader-error-box');
          var txt = document.getElementById('loader-error-text');
          if (box && txt) {
            box.style.display = 'block';
            txt.textContent = 'Module Loading Error: ' + (err.message || err) + (err.stack ? '\n' + err.stack : '');
          }
        });
    </script>
  </body>
</html>
